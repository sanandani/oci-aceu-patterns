services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-synthetic_local_admin_only}
    ports: ["1521:1521"]
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./aceu-trust-service/db:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 120s
  service:
    build: ./aceu-trust-service
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USER: aceu_app
      DB_PASSWORD: aceu_app_local_only
      UCP_MIN: "2"
      UCP_MAX: "8"
      UCP_WAIT_SECONDS: "5"
    ports: ["8080:8080"]
    depends_on:
      oracle:
        condition: service_healthy
volumes:
  oracle-data:
