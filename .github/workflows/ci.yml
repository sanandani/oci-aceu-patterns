name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Start Oracle Free and service
        run: docker compose up -d --build
      - name: Maven unit and Oracle integration tests
        env:
          ACEU_IT_URL: jdbc:oracle:thin:@localhost:1521/FREEPDB1
          ACEU_IT_USER: aceu_app
          ACEU_IT_PASSWORD: aceu_app_local_only
        run: mvn -B -f aceu-trust-service/pom.xml test
      - name: REST demo and audit verification
        run: ./scripts/demo.sh
      - name: Scanner rule tests
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
          python aceu_scan.py --fixtures
      - name: Terraform format and validate
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
      - name: Stop Oracle containers
        if: always()
        run: docker compose down -v
