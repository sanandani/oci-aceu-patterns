[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aceu-scan"
version = "1.0.0"
description = "Read-only OCI posture scan with fixture mode"
requires-python = ">=3.10"
dependencies = ["oci>=2.150.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aceu-scan = "aceu_scan:main"

[tool.setuptools]
py-modules = ["aceu_scan"]
